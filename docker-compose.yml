name: stt-suite  # pinned: keeps the running container when the folder is renamed

services:
  stt:
    image: stt-suite
    build: .
    container_name: stt-suite
    restart: unless-stopped  # Always running (CPU mode has no VRAM cost)
    ports:
      - "127.0.0.1:5080:5052"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # Whisper model size (tiny, base, small, medium, large-v3)
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      # The GPU gets the big model; CPU keeps the WHISPER_MODEL default — large on CPU would be
      # painfully slow. A model that fits no card is not loaded: the GPU answers 503 (device=auto
      # tries the next smaller one, then the CPU).
      - WHISPER_GPU_MODEL=${WHISPER_GPU_MODEL:-large-v3}
      # Each device has its own engine, any mix: whisper or parakeet (NVIDIA Parakeet TDT 0.6B v3 —
      # 25 European languages, much faster, see README). Parakeet quality per device: fp32 (full)
      # or int8 (smaller, more word errors).
      - STT_CPU_ENGINE=${STT_CPU_ENGINE:-whisper}
      - STT_GPU_ENGINE=${STT_GPU_ENGINE:-whisper}
      - STT_CPU_QUALITY=${STT_CPU_QUALITY:-fp32}
      - STT_GPU_QUALITY=${STT_GPU_QUALITY:-fp32}
      # Compute type per device (int8 for CPU, float16 for GPU)
      - WHISPER_CPU_COMPUTE=int8
      - WHISPER_GPU_COMPUTE=float16
      # GPU auto-kill: minutes of GPU inactivity before killing GPU worker process
      # (fully releases CUDA context + VRAM, enables GPU P8 power state)
      # CPU model stays loaded permanently. Set to 0 to disable GPU TTL.
      - STT_GPU_TTL_MINUTES=${STT_GPU_TTL_MINUTES:-30}
      # Eager load CPU model at startup (1=yes, 0=lazy)
      - STT_EAGER_LOAD=${STT_EAGER_LOAD:-1}
      # ── Speaker diarization (optional, per-request via diarize=1) ──
      # Model + VRAM floor for the pyannote worker; GPU-Orc names its card (Whisper's worker counts
      # there like any other holder).
      - DIARIZE_MODEL=${DIARIZE_MODEL:-pyannote/speaker-diarization-community-1}
      - DIARIZE_MIN_VRAM_MIB=${DIARIZE_MIN_VRAM_MIB:-1500}
      - DIARIZE_TTL_MINUTES=${DIARIZE_TTL_MINUTES:-10}
      # Optional override — normally unset: the token is read from the
      # host's token file through the mount below (single source of truth).
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_TOKEN_PATH=/hf-host/token
      # GPU-Orc of this machine names the card of every GPU worker (POST /place): it counts what every
      # program may take on a card, adds its margin and keeps the room until the worker runs. From the
      # container the host is host.docker.internal, and GPU-Orc wants its token there (the token file inside
      # the directory mounted below). STT_GPU_ORC_CONSUMER is this service's name among GPU-Orc's consumers.
      # Unset URL = no GPU-Orc: nothing loads on a GPU (device=auto goes on, e.g. to the CPU).
      - STT_GPU_ORC_URL=${STT_GPU_ORC_URL:-}
      - STT_GPU_ORC_TOKEN_FILE=${STT_GPU_ORC_TOKEN_FILE:-}
      - STT_GPU_ORC_CONSUMER=${STT_GPU_ORC_CONSUMER:-stt-suite}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent HuggingFace model cache
      - stt_suite_models:/root/.cache/huggingface
      # Settings changed via /config (survive a restart; the .env only gives the first defaults)
      - stt_suite_state:/state
      # pyannote models are gated — reuse the host's HF token instead of
      # copying it into .env. The directory, not the file: a missing file
      # would make Docker create a directory in its place, and every
      # huggingface_hub call then failed with IsADirectoryError. A missing
      # token now simply means no token.
      - ${HOME}/.cache/huggingface:/hf-host:ro
      # Directory of GPU-Orc's token file, read-only (the directory: a missing file would become a directory)
      - ${STT_GPU_ORC_DIR:-/tmp/stt-suite-no-gpu-orc}:/gpu-orc:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5052/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  stt_suite_models:
    name: stt_suite_models
  stt_suite_state:
    name: stt_suite_state
