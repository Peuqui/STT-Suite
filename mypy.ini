[mypy]
# The project's types come from its own venv (tests and Flask); ruff and mypy themselves live in ~/.venv/devtools.
python_executable = .venv/bin/python

# Only in the Docker image (Dockerfile), not in the test venv: the engines, the diarization and what they bring.
# Torch alone is several GB; the code that imports them runs in the image only. PIL is for scripts/render_badge_icons.py, a
# tool for the developer's machine.
[mypy-faster_whisper.*,huggingface_hub.*,onnx_asr.*,numpy.*,torch.*,pyannote.*,PIL.*]
ignore_missing_imports = True
